name: Max Note checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and logic checks
        run: |
          node --check logic.js
          node --check appearance.js
          node --check test.js
          node test.js
          node --check scripts/check-agent-kit.mjs
          node scripts/check-agent-kit.mjs
