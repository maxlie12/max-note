name: Max Note checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and logic checks
        run: |
          node --check logic.js
          node --check appearance.js
          node --check test.js
          node test.js
          node --check scripts/check-agent-kit.mjs
          node scripts/check-agent-kit.mjs

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test dependencies
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Run browser smoke at 390px and 320px
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/max-note-smoke-http.log 2>&1 &
          node scripts/browser-smoke.cjs
